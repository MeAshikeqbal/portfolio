name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public values (they appear in every Sanity image URL); override with repo variables if needed.
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || '0oqq6f9z' }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Build + Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'sanity/**') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Publication state of /uses and /now
        # Read from the Sanity API host (not the CDN) before building, so the build and the
        # tests agree. Drop Next's restored fetch cache so the build can't serve stale content.
        run: |
          node scripts/about-state.mjs >> "$GITHUB_ENV"
          rm -rf .next/cache/fetch-cache
      - run: npm run build
        env:
          # Cloudflare's documented always-pass test key, so the contact form is testable.
          # This build is only used for tests, never deployed.
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=mobile
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Lighthouse budgets
        # Same production build. Accessibility, best practices and SEO are hard gates;
        # performance only warns (lab numbers on shared runners are noisy).
        # /uses and /now join the audited pages once they're published.
        run: npx @lhci/cli@0.15.1 autorun --config=${{ env.ABOUT_PAGES == 'published' && 'lighthouserc.published.json' || 'lighthouserc.json' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
