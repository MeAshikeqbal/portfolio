version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      sanity:
        patterns: ["sanity", "next-sanity", "@sanity/*", "sanity-plugin-*"]
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns:
          ["vitest", "vite", "jsdom", "@testing-library/*", "@playwright/test", "@axe-core/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Node is pinned to 24.x (package.json engines): keep its types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) doesn't support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react, -jsx-a11y and -import (via eslint-config-next) don't declare
      # ESLint 10 support yet. Remove once eslint-config-next ships with it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
