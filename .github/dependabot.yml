version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      sanity:
        patterns: ["sanity", "next-sanity", "@sanity/*", "sanity-plugin-*"]
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns: ["vitest", "vite", "jsdom", "@testing-library/*", "@playwright/test", "@axe-core/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
